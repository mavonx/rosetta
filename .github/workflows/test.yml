name: Run Tests

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Maven tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run JUnit and Mockito tests
        run: mvn -B test
